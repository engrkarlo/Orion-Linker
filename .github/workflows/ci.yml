name: Build and test OrionLink
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: minecraft-plugin/pom.xml
      - run: mvn -B -f minecraft-plugin/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: OrionLink-Paper-26.3
          path: minecraft-plugin/target/OrionLink.jar
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check extension.js

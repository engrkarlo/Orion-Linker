name: OrionBridge checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean verify
      - run: java -cp target/classes:target/test-classes io.github.engrkarlo.orionbridge.RetryGateSmoke
      - run: java -cp target/classes:target/test-classes io.github.engrkarlo.orionbridge.AuditSmoke
      - run: java -cp target/classes:target/test-classes io.github.engrkarlo.orionbridge.SanctionSmoke
      - run: java -cp target/classes:target/test-classes io.github.engrkarlo.orionbridge.VerificationSmoke
      - run: mvn -B dependency:build-classpath -Dmdep.outputFile=target/test-classpath
      - run: java -cp "target/classes:target/test-classes:$(cat target/test-classpath)" io.github.engrkarlo.orionbridge.ConfigMigrationSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: OrionBridge-Paper-26.3
          path: target/OrionBridge-*.jar
          if-no-files-found: error
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.js
      - run: node --check extension/orionbridge/extension.js
      - run: |
          mkdir -p dist/orionbridge
          cp -r bot dist/orionbridge/
          cp extension/orionbridge/* dist/orionbridge/
          cp docs/extension-setup.md dist/orionbridge/README.md
          cd dist && zip -r OrionBridge-OrionBot-Extension.zip orionbridge
      - uses: actions/upload-artifact@v4
        with:
          name: OrionBridge-OrionBot-Extension
          path: dist/OrionBridge-OrionBot-Extension.zip
          if-no-files-found: error

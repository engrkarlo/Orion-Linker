# Console-only setup; the one-time code is private to the server owner.
setup:
  code: '<light_purple>OrionBridge setup</light_purple> <gray>·</gray> <white><code></white> <gray>(5 minutes). Run /orionbridge setup in Discord. Then run ob setup status.</gray>'
  pending: '<light_purple>Pending setup</light_purple> <gray>Guild:</gray> <white><guild></white> <gray>Server:</gray> <white><server></white> <gray>Requested by:</gray> <white><actor></white> <gray>Feature:</gray> <white><feature></white> <yellow>Verify these IDs and run ob setup approve <id>.</yellow>'
  none: '<yellow>No unexpired setup request. Run ob setup again if needed.</yellow>'
  cancelled: '<gray>Setup cancelled.</gray>'
  unavailable: '<red>Start the Pull connection before setup.</red>'
  applied: '<green>Credentials provisioned. Check OrionBot health and choose the features you want.</green>'
  reload-needed: '<yellow>Credentials saved. Run ob reload when the server is idle and check ob status.</yellow>'
  failed: '<red>Setup not completed. Check the console; existing credentials will not be replaced.</red>'
  usage: '<gray>ob setup [status | approve ID | cancel]</gray>'

# OrionBridge | LuckPerms rank synchronization
# Requires LuckPerms, verification and matching Role Sync settings in OrionBot.
# Configure explicit mappings in Discord; this file limits what Minecraft can grant.
# Rank synchronization does not grant OP, and unsafe inherited permissions are refused.
# Use /ob reload after changes.
roles:
  enabled: false
  # Read previously linked offline ranks where a canonical identity is supported.
  # Unknown results do not automatically remove an existing managed Discord role.
  offline-reconciliation: true
  # Opt in only for stable AuthMe or noncanonical Floodgate UUID mappings.
  # Requires Observed ranks enabled on the bot. Observations expire after 24 hours.
  offline-observed-identities: false
  # Exact LuckPerms group names the bridge is allowed to grant (e.g. [member, vip]).
  # Empty means no Minecraft groups may be granted.
  allowed-groups: []
  # Exact safe permission nodes allowed in those groups. No wildcard permissions.
  # Empty means groups containing positive permissions may be refused.
  allowed-permissions: []

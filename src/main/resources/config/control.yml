# OrionBridge | Signed control and moderation
# Pull mode only. Required for Discord verification, chat and signed actions.
# When enabled, the plugin can receive approved typed actions (e.g. mute, freeze,
# ban), not arbitrary console commands. Enable matching features in OrionBot.
# Requires the guild and server IDs from config/audit.yml and its OWN key.
# Restart Paper after changes.
control:
  enabled: false
  # Paste the control signing key from Setup credentials in OrionBot.
  # Never reuse the telemetry token or audit signing key.
  signing-key: ''

# OrionBridge | Audit and evidence
# Choose Evidence in /orionbridge setup to enable this feature.
# Observations are not punishments. Review evidence before approving cases.
audit:
  enabled: false

  # Managed by setup; leave these blank. Older credentials are imported
  # automatically into internal/credentials.yml and backed up.
  guild-id: ''
  server-id: ''
  signing-key: ''

  # Record a block-activity observation at this many attempts per minute.
  # This is separate from Guard's actual enforcement limits.
  block-changes-per-minute: 500

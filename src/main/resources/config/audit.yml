# OrionBridge | Audit and evidence
# Sends signed activity/evidence to OrionBot in Pull mode. Enable audit in the
# Discord control center as well. This does not punish players by itself.
# Restart Paper after changes. Keep the signing key private.
audit:
  enabled: false
  # Copy these two IDs from Setup credentials in OrionBot. They identify this
  # guild and Minecraft server and are also used by control.yml.
  guild-id: ''
  server-id: ''
  # Separate audit key from OrionBot; do not reuse the connection or control key.
  signing-key: ''
  # Attempts per minute before recording a block-activity threshold event.
  # This is an observation threshold, not the Guard enforcement limit.
  block-changes-per-minute: 500

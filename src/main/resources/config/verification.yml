# OrionBridge | Account verification
# Start with the Discord setup wizard. It activates optional account linking first.
# Required linking is a separate choice: unverified players (including OPs)
# are restricted only when force is true. Java + Floodgate Bedrock are supported.
# Offline Java players must finish AuthMe login before linking.
# Required linking expires access during bot/network outages.
# Emergency console command: ob verification-off (until reload or restart).
# Use /ob reload after changes.
verification:
  # Enable account linking. Leave false if you only want server status.
  enabled: false
  # Set true only after setup and testing. Both switches activate account linking.
  setup-complete: false
  # true = require linking before gameplay (including operators).
  # false = optional linking; unlinked players can play, but cannot use trusted features.
  # Existing installations retain forced verification unless explicitly changed.
  force: true
  # DIALOG = native Java dialog; INVENTORY = chest-style Java menu.
  # Bedrock uses its own forms automatically. See menus/ for appearance.
  java-interface: DIALOG
  # Invite shown to players on verification screens. Use your own Discord link.
  discord-invite: ''
  # How long a signed authorization is valid (15–60 seconds).
  # A shorter lease revokes access sooner during outages but increases renewals.
  # This is NOT the five-minute verification code lifetime.
  lease-seconds: 60
  # Reopen verification for restricted players after this many seconds (0–300).
  # 0 disables automatic reopening, not the verification requirement.
  reopen-seconds: 15
  # Offline Java + AuthMe: setup automatically saves a unique realm for this server.
  # Leave blank until guided setup; online Java and Floodgate do not need a realm.
  # Never rename a realm after accounts have linked. Share an explicit realm only
  # across servers using the same trusted AuthMe database and account namespace.
  auto-authme-realm: true
  authme-realm: ''
  lobby:
    # Optional: move restricted players to a loaded safe spawn, remember their
    # original position, and return them after verification. No inventory changes.
    enabled: false
    # Exact loaded world name. Leave empty while disabled.
    world: ''

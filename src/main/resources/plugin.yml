name: OrionBridge
version: '2.0.0-alpha.6'
main: io.github.engrkarlo.orionbridge.OrionBridge
api-version: '26.3'
description: Authenticated telemetry, experimental identity and security bridge for OrionBot.
author: Karlow
softdepend: [SkinsRestorer, floodgate, AuthMe, Geyser-Spigot, LuckPerms, WorldEdit, FastAsyncWorldEdit, CoreProtect]
permissions:
  orionbridge.hide:
    description: Exclude this player from the bridge roster and counts.
    default: false
  orionbridge.reload:
    description: Reload OrionBridge configuration and connection.
    default: op
  orionbridge.admin:
    description: View bridge diagnostics.
    default: op
  orionbridge.admin.gui:
    description: Open trusted administrator dashboard (linked staff profile also required).
    default: false
commands:
  ob:
    description: Manage OrionBridge.
    usage: /ob account | /ob link | /ob admin | /ob reload

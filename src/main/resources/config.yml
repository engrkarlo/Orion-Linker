# OrionBridge | Connection and telemetry
# Set the hosting allocation port, start the server, then run ob setup.
# The automatic setup in OrionBot handles private signing credentials for you.
# Advanced features have their own files in config/.
# Change only what you need. Pairing credentials live in internal/credentials.yml.
# Back up the entire plugin folder, including internal/.
# Restart Paper after installing an update; /ob reload applies all OrionBridge configuration and theme files.
# Do not manually change the version; the plugin handles upgrades.
config-version: 15

# pull: OrionBot reads your Minecraft server through its HTTPS reverse proxy.
# Required for linking, moderation, chat, ranks and other security features.
# push: Minecraft sends telemetry to OrionBot; security features are not available.
mode: pull

# AUTO accepts WebSocket and authenticated HTTP on the same proxy allocation.
# HTTP is the compatibility option. WEBSOCKET requires the socket-capable listener.
transport: AUTO

# Use 0.0.0.0 for a Pterodactyl allocation/reverse proxy, or 127.0.0.1
# only when the reverse proxy runs on the same network namespace.
bind: '0.0.0.0'
# Your allocated bridge port, not the Minecraft game port.
port: 25762
# Push only: paste the pairing URL from OrionBot. Leave empty in Pull mode.
endpoint: ''
# Legacy import only: leave empty. Existing tokens migrate into private storage.
# For new connections use ob setup; do not copy or rotate private keys manually.
token: ''
# How often the plugin collects player count, TPS, MSPT and other telemetry (5–30s).
interval-seconds: 10
# true: exclude players marked vanished from the public roster.
hide-vanished: true
# true: respect each player's server-listing privacy preference.
respect-listing-preference: true
# true: try saved skins from SkinsRestorer if live profile textures are missing.
# Does not create new skins; ignored if the plugin is not installed.
skinsrestorer-fallback: true

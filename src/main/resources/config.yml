config-version: 5
# Pull: OrionBot fetches from this server through your HTTPS reverse proxy.
# Push: OrionBridge sends to the endpoint generated by OrionBot.
mode: pull
bind: '0.0.0.0'
port: 25762
endpoint: ''
# Pull generates a random token when blank. Push requires the pairing token.
token: ''
interval-seconds: 10
hide-vanished: true
respect-listing-preference: true
skinsrestorer-fallback: true
# Edit and run /ob reload (permission: orionbridge.reload).

# Experimental observation feed. Requires a restart after changing these.
# Keep disabled until the bot-side consumer is installed. Use a separate
# random 64-hex signing key; never share the existing telemetry token.
audit:
  enabled: false
  guild-id: ''
  server-id: ''
  signing-key: ''
  block-changes-per-minute: 500

# Experimental typed Minecraft moderation. Separate from audit signing key.
# Scope uses audit.guild-id and audit.server-id. Requires restart.
control:
  enabled: false
  signing-key: ''

# Experimental verification: activate only after the bot host is integrated
# and the setup has been explicitly completed. No implicit operator bypass.
verification:
  enabled: false
  setup-complete: false
  java-interface: DIALOG
  discord-invite: ''
  lease-seconds: 60
  reopen-seconds: 15
  # Share a realm ONLY across servers using the same trusted AuthMe database.
  # Empty means offline Java identity cannot be verified.
  authme-realm: ''

# Optional pseudonymous network correlation. Enable ONLY when the actual
# client address is available, not a shared proxy/backend address.
correlation:
  enabled: false
  confirm-real-client-addresses: false
  guild-key: ''

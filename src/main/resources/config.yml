config-version: 11
# Pull: OrionBot fetches from this server through your HTTPS reverse proxy.
# Push: OrionBridge sends to the endpoint generated by OrionBot.
mode: pull
bind: '0.0.0.0'
port: 25762
endpoint: ''
# Pull generates a random token when blank. Push requires the pairing token.
token: ''
interval-seconds: 10
hide-vanished: true
respect-listing-preference: true
skinsrestorer-fallback: true
# Edit and run /ob reload (permission: orionbridge.reload).

# Experimental observation feed. Requires a restart after changing these.
# Keep disabled until the bot-side consumer is installed. Use a separate
# random 64-hex signing key; never share the existing telemetry token.
audit:
  enabled: false
  guild-id: ''
  server-id: ''
  signing-key: ''
  block-changes-per-minute: 500

# Experimental typed Minecraft moderation. Separate from audit signing key.
# Scope uses audit.guild-id and audit.server-id. Requires restart.
control:
  enabled: false
  signing-key: ''

# Experimental verification: activate only after the bot host is integrated
# and the setup has been explicitly completed. No implicit operator bypass.
verification:
  enabled: false
  setup-complete: false
  java-interface: DIALOG
  discord-invite: ''
  lease-seconds: 60
  reopen-seconds: 15
  # Share a realm ONLY across servers using the same trusted AuthMe database.
  # Empty means offline Java identity cannot be verified.
  authme-realm: ''

# Optional pseudonymous network correlation. Enable ONLY when the actual
# client address is available, not a shared proxy/backend address.
correlation:
  enabled: false
  confirm-real-client-addresses: false
  guild-key: ''

# Explicitly opt in after testing with a verified staff account.
# Profiles only relax OrionGuard rules; they never grant Minecraft permission.
guard:
  enabled: false
  block-sensitive-commands: true
  enforce-worldedit: true
  allow-non-player-edits: false
  non-player-per-operation: 10000
  non-player-per-minute: 20000
  block-changes-per-minute: 500
  container-items-per-minute: 4096
  entities-per-10-seconds: 500
  joins-per-10-seconds: 20
  join-lockdown-seconds: 0
  containment-seconds: 60
  protected-worlds: []
  # Optional inclusive WorldEdit regions: world, x1, y1, z1, x2, y2, z2.
  protected-regions: []
  # Rule responses are additional to hard command/edit/block limits.
  # Omitted keys retain the legacy configured containment/lockdown duration.
  # ALERT, BUILD_RESTRICTION, WORLDEDIT_RESTRICTION, COMMAND_RESTRICTION,
  # FREEZE, QUARANTINE; LOCKDOWN only for JOIN_SPIKE.
  rules:
    GUARD_COMMAND_BLOCKED:
      enabled: true
      severity: CRITICAL
      response: ALERT
    WORLDEDIT_BLOCKED:
      enabled: true
      severity: CRITICAL
      response: ALERT
    GUARD_BLOCK_LIMIT:
      enabled: true
      severity: HIGH
      response: QUARANTINE
    CONTAINER_ACTIVITY:
      enabled: true
      severity: MEDIUM
      response: ALERT
    JOIN_SPIKE:
      enabled: true
      severity: HIGH
    ENTITY_SPIKE:
      enabled: true
      severity: MEDIUM
      response: ALERT
    EXPLOSION_ACTIVITY:
      enabled: true
      severity: HIGH
      response: ALERT
  profiles:
    builder:
      commands: []
      worldedit-per-operation: 100000
      worldedit-per-minute: 200000
      blocks-per-minute: 5000
      staff-chat: true
      lockdown-bypass: false
      entity-tasks: false
      worldedit-scope:
        worlds: []
        regions: []
        operations: [BLOCK, BIOME, ENTITY]
        commands: []
    administrator:
      commands: ['minecraft:gamemode', 'luckperms:luckperms']
      worldedit-per-operation: 500000
      worldedit-per-minute: 1000000
      blocks-per-minute: 10000
      staff-chat: true
      lockdown-bypass: true
      entity-tasks: true
      worldedit-scope:
        worlds: []
        regions: []
        operations: [BLOCK, BIOME, ENTITY]
        commands: []

# No rank can be granted without a local group and exact permission allowlist.
# Groups with unknown or dangerous inherited permissions are rejected.
roles:
  enabled: false
  # Bounded read-only LuckPerms lookup for previously verified Java identities.
  offline-reconciliation: true
  allowed-groups: []
  allowed-permissions: []

chat:
  enabled: false
  minecraft-to-discord: true
  discord-to-minecraft: true
  staff-chat: false

# CoreProtect lookup is opt-in; execution requires explicit permission,
# active lockdown, offline target and an unchanged preview.
recovery:
  enabled: false
  allow-rollback: false
  maximum-records: 500
  maximum-radius: 32
  maximum-seconds: 900

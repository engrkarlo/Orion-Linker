# OrionBridge | Java native verification dialogs
# Controls account linking before gameplay, not the post-verification dashboard.
# Used for DIALOG mode and text fallback. Only button names and dialog sizing are used; material/image are retained for compatibility.
# Use MiniMessage colors. Keep <code>, <discord>, <discord_id> and <invite> placeholders where needed.
# Never expose the private code in public chat. Use /ob reload to apply changes.
theme-version: 3
title: '<light_purple>OrionBridge</light_purple> | <white>Account verification</white>'
# Each screen corresponds to a different step of the verification process.
screens:
  welcome: '<white>Welcome! Link your Discord account before playing.</white><newline><gray>Join our Discord: <invite></gray>'
  authenticate: '<white>Authenticate your Minecraft account first.</white><newline><gray>Then refresh to start verification.</gray>'
  waiting: '<white>Requesting your private verification code…</white><newline><gray>OrionBot will deliver it shortly.</gray>'
  code: '<white>Enter this private code in the Discord verification panel:</white><newline><light_purple><code></light_purple><newline><gray>Never share it with another player.</gray>'
  confirm: '<white>Confirm that this Discord account is yours:</white><newline><light_purple><discord></light_purple><newline><gray>ID: <discord_id></gray>'
  pending: '<white>Confirmation received. Waiting for OrionBot to finish linking.</white>'
  verified: '<green>Account verified.</green><newline><white>Discord ID: <discord_id></white>'
# Button names only change appearance, not the action they perform.
buttons:
  link:
    name: '<white>Link Discord Account</white>'
    # Optional hover text on Java dialogs (leave blank to disable).
    tooltip: ''
    material: TRIPWIRE_HOOK
    image: 'textures/items/trip_wire_source'
  refresh:
    name: '<white>Refresh</white>'
    # Optional hover text on Java dialogs (leave blank to disable).
    tooltip: ''
    material: CLOCK
    image: 'textures/items/clock_item'
  regenerate:
    name: '<white>Generate New Code</white>'
    # Optional hover text on Java dialogs (leave blank to disable).
    tooltip: ''
    material: PAPER
    image: 'textures/items/paper'
  confirm:
    name: '<white>Confirm Account</white>'
    # Optional hover text on Java dialogs (leave blank to disable).
    tooltip: ''
    material: EMERALD
    image: 'textures/items/emerald'
  close:
    name: '<white>Close</white>'
    # Optional hover text on Java dialogs (leave blank to disable).
    tooltip: ''
    material: BARRIER
    image: ''
# Number of buttons per row (1–2) and button width (50–300).
columns: 1
button-width: 160
